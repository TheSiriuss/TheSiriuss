<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="How Embertarn finds a friend: look up the PeerID in the DHT, connect directly, talk with a fresh key for every message. Compare the fingerprint and the short code once over another channel.">
  <title>How Embertarn finds your friend</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090c14"/><stop offset="1" stop-color="#1a1320"/></linearGradient></defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="20" fill="none" stroke="#b8802a" stroke-opacity="0.4"/>
  <g><rect x="30" y="30" width="340" height="166" rx="16" fill="#10131d" stroke="#b8802a" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.12;0.33;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><circle cx="66" cy="70" r="16" fill="#b8802a"/><text x="66" y="76.5" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#10131d">1</text><text x="94" y="79" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff3df">Look up</text><g transform="translate(330 70)"><circle cx="0" cy="0" r="11" fill="none" stroke="#ffb454" stroke-width="2.4"/><path d="M8 8 L17 17" stroke="#ffb454" stroke-width="2.8" stroke-linecap="round"/></g><text x="56" y="122" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Ask the Kademlia DHT for your</text><text x="56" y="148" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">friend's PeerID. It answers with</text><text x="56" y="174" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">the addresses they can be reached at.</text></g><g><rect x="430" y="30" width="340" height="166" rx="16" fill="#10131d" stroke="#b8802a" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.12;0.33;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect><circle cx="466" cy="70" r="16" fill="#b8802a"/><text x="466" y="76.5" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#10131d">2</text><text x="494" y="79" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff3df">Connect</text><g transform="translate(730 70)"><circle cx="-12" cy="0" r="5" fill="#ffb454"/><circle cx="12" cy="0" r="5" fill="#ffb454"/><path d="M-7 0 H7" stroke="#ffb454" stroke-width="2.4" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" values="6;0" dur="0.8s" repeatCount="indefinite"/></path></g><text x="456" y="122" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Straight to your friend over QUIC</text><text x="456" y="148" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">or TCP, using hole punching.</text><text x="456" y="174" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Calls always use this direct link.</text></g><g><rect x="830" y="30" width="340" height="166" rx="16" fill="#10131d" stroke="#b8802a" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.12;0.33;1" dur="6s" begin="4s" repeatCount="indefinite"/></rect><circle cx="866" cy="70" r="16" fill="#b8802a"/><text x="866" y="76.5" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#10131d">3</text><text x="894" y="79" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff3df">Talk</text><g transform="translate(1130 70)"><rect x="-11" y="-3" width="22" height="16" rx="3" fill="#ffb454"/><path d="M-6 -3 V-8 a6 6 0 0 1 12 0 V-3" fill="none" stroke="#ffb454" stroke-width="2.4"/></g><text x="856" y="122" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Double Ratchet gives every message</text><text x="856" y="148" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">a fresh key. The cipher is</text><text x="856" y="174" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">XChaCha20-Poly1305.</text></g><path d="M374 113 H418" stroke="#ffb454" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="10;0" dur="0.7s" repeatCount="indefinite"/></path><path d="M417 105 L426 113 L417 121 Z" fill="#ffb454"/><path d="M774 113 H818" stroke="#ffb454" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="10;0" dur="0.7s" repeatCount="indefinite"/></path><path d="M817 105 L826 113 L817 121 Z" fill="#ffb454"/>
  <rect x="30" y="224" width="1140" height="78" rx="16" fill="#ffb454" fill-opacity="0.05" stroke="#ffb454" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <text x="600" y="255" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#ffb454">Once, over a channel you already trust</text>
  <text x="600" y="281" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">compare the 160-bit key fingerprint and the short session code (SAS)</text>
</svg>
