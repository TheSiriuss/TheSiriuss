<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="How Embertarn finds a friend: 1. look up the PeerID in the DHT, 2. connect directly, 3. talk with a new key for every message. Compare the fingerprint and the short code once, over another channel.">
  <title>How Embertarn finds your friend</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c14"/>
      <stop offset="1" stop-color="#171220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#b8802a" stroke-opacity="0.35"/>
  <rect x="30" y="30" width="340" height="160" rx="14" fill="#10131d" stroke="#b8802a" stroke-opacity="0.55"/><circle cx="64" cy="68" r="15" fill="#b8802a"/><text x="64" y="74" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#10131d">1</text><text x="92" y="76" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff3df">Look up</text><text x="56" y="118" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Ask the Kademlia DHT for your</text><text x="56" y="144" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">friend's PeerID. It answers with</text><text x="56" y="170" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">the addresses they can be reached at.</text><rect x="430" y="30" width="340" height="160" rx="14" fill="#10131d" stroke="#b8802a" stroke-opacity="0.55"/><circle cx="464" cy="68" r="15" fill="#b8802a"/><text x="464" y="74" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#10131d">2</text><text x="492" y="76" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff3df">Connect</text><text x="456" y="118" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Straight to your friend over QUIC</text><text x="456" y="144" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">or TCP, using hole punching.</text><text x="456" y="170" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Calls always use this direct link.</text><rect x="830" y="30" width="340" height="160" rx="14" fill="#10131d" stroke="#b8802a" stroke-opacity="0.55"/><circle cx="864" cy="68" r="15" fill="#b8802a"/><text x="864" y="74" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#10131d">3</text><text x="892" y="76" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff3df">Talk</text><text x="856" y="118" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">Double Ratchet gives every message</text><text x="856" y="144" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">a fresh key. The cipher is</text><text x="856" y="170" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">XChaCha20-Poly1305.</text>
  <path d="M372 110 H420" stroke="#ffb454" stroke-width="2.4" stroke-linecap="round"/><path d="M419 102 L428 110 L419 118 Z" fill="#ffb454"/><circle r="3.2" cy="110" fill="#fff0cf"><animate attributeName="cx" values="372;420" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="1.8s" repeatCount="indefinite"/></circle><path d="M772 110 H820" stroke="#ffb454" stroke-width="2.4" stroke-linecap="round"/><path d="M819 102 L828 110 L819 118 Z" fill="#ffb454"/><circle r="3.2" cy="110" fill="#fff0cf"><animate attributeName="cx" values="772;820" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <rect x="30" y="218" width="1140" height="76" rx="14" fill="none" stroke="#ffb454" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <text x="600" y="248" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#ffb454">Once, over a channel you already trust</text>
  <text x="600" y="274" text-anchor="middle" font-family="'Noto Sans','DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d8c8b4">compare the 160-bit key fingerprint and the short session code (SAS)</text>
</svg>
